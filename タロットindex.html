<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>夜想タロット</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Karla:wght@400;500;600&display=swap');

  :root {
    --night: #14102A;
    --panel: #1F1836;
    --panel-light: #2A2049;
    --gold: #C9A24B;
    --gold-soft: #E4CD8E;
    --wine: #6B2140;
    --ivory: #EDE6D6;
    --lavender: #9C8FB8;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--night);
    font-size: 16px; /* iOS拡大防止のため固定 */
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
  }

  body {
    font-family: 'Karla', sans-serif;
    color: var(--ivory);
    background: radial-gradient(ellipse at 50% -10%, var(--panel-light) 0%, var(--night) 55%);
    min-height: 100vh;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
    position: relative;
    overflow-x: hidden;
  }

  #stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
  }
  .star {
    position: absolute;
    border-radius: 50%;
    background: var(--gold-soft);
    animation: twinkle 3.5s ease-in-out infinite;
  }
  @keyframes twinkle { 0%, 100% { opacity: 0.15; } 50% { opacity: 0.75; } }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 480px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 36px;
    cursor: pointer;
  }
  header .logo {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  header .logo .mark { color: var(--gold); font-size: 20px; }
  header .logo .title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.03em;
  }
  .btn-ghost {
    background: none;
    border: 1px solid rgba(156, 143, 184, 0.4);
    color: var(--lavender);
    border-radius: 20px;
    padding: 6px 16px;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
    -webkit-appearance: none;
    appearance: none;
  }

  .screen { display: none; }
  .screen.active { display: block; }

  .lead {
    font-family: 'Cormorant Garamond', serif;
    font-size: 26px;
    line-height: 1.5;
    margin: 0 0 8px;
  }
  .sub {
    font-size: 14px;
    color: var(--lavender);
    margin: 0 0 32px;
  }

  .spread-card {
    border: 1px solid rgba(201, 162, 75, 0.27);
    border-radius: 10px;
    padding: 20px 22px;
    cursor: pointer;
    background: linear-gradient(120deg, var(--panel), rgba(42, 32, 73, 0.27));
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    transition: border-color 0.25s ease, transform 0.2s ease;
  }
  .spread-card:active { transform: translateX(2px); }
  .spread-card .title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .spread-card .desc { font-size: 13px; color: var(--lavender); }
  .spread-card .arrow { color: var(--gold); font-size: 18px; }

  .back-link {
    background: none;
    border: none;
    color: var(--lavender);
    font-size: 13px;
    cursor: pointer;
    margin-bottom: 20px;
    padding: 0;
    font-family: inherit;
  }

  .reading-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 24px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .reading-desc { font-size: 13px; color: var(--lavender); margin-bottom: 26px; }

  .cat-label { font-size: 13px; color: var(--lavender); display: block; margin-bottom: 12px; }
  .cat-list { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 26px; }
  .cat-btn {
    background: none;
    border: 1px solid rgba(201, 162, 75, 0.27);
    color: var(--lavender);
    border-radius: 20px;
    padding: 9px 18px;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
    -webkit-appearance: none;
    appearance: none;
    transition: all 0.15s ease;
  }
  .cat-btn.selected {
    background: linear-gradient(120deg, var(--wine), rgba(201, 162, 75, 0.33));
    border-color: var(--gold);
    color: var(--ivory);
  }

  .primary-btn {
    background: linear-gradient(120deg, var(--wine), rgba(201, 162, 75, 0.33));
    border: 1px solid var(--gold);
    color: var(--ivory);
    border-radius: 24px;
    padding: 12px 32px;
    font-size: 15px;
    letter-spacing: 0.03em;
    cursor: pointer;
    font-family: inherit;
    -webkit-appearance: none;
    appearance: none;
  }
  .primary-btn:disabled {
    background: var(--panel);
    border-color: rgba(156, 143, 184, 0.27);
    color: var(--lavender);
    opacity: 0.6;
    cursor: not-allowed;
  }

  .shuffle-zone { display: flex; flex-direction: column; align-items: center; padding: 40px 0; }
  .shuffle-hint { margin-top: 20px; font-size: 13px; color: var(--lavender); }

  .card-back, .card-face {
    width: 108px;
    height: 176px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--gold);
    position: relative;
    overflow: hidden;
  }
  .card-back {
    background: linear-gradient(155deg, var(--wine) 0%, var(--panel) 60%, var(--night) 100%);
    box-shadow: 0 4px 14px rgba(0,0,0,0.5);
    cursor: pointer;
  }
  .card-back.pulsing { box-shadow: 0 0 18px rgba(201, 162, 75, 0.4); }
  .card-back::after {
    content: '';
    position: absolute;
    inset: 6px;
    border: 1px solid rgba(201, 162, 75, 0.33);
    border-radius: 4px;
  }
  .card-back .sym { font-size: 20px; color: var(--gold); opacity: 0.85; }

  .card-face {
    flex-direction: column;
    padding: 0;
    background: var(--panel);
    box-shadow: 0 6px 18px rgba(0,0,0,0.55);
    animation: flipIn 0.5s ease;
  }
  .card-face img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.3s ease;
  }
  .card-face.reversed img { transform: rotate(180deg); }
  .card-face .caption {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 5px 6px 4px;
    background: linear-gradient(to top, rgba(20,16,42,0.92), rgba(20,16,42,0));
    text-align: center;
  }
  .card-face .name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--ivory);
    line-height: 1.2;
  }
  .card-face .kw { font-size: 9px; color: var(--goldSoft, var(--gold-soft)); margin-top: 2px; }

  @keyframes flipIn { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: scale(1); } }
  @keyframes shuffleShake {
    0%, 100% { transform: translateX(0) rotate(0deg); }
    20% { transform: translateX(-6px) rotate(-3deg); }
    40% { transform: translateX(6px) rotate(3deg); }
    60% { transform: translateX(-5px) rotate(-2deg); }
    80% { transform: translateX(5px) rotate(2deg); }
  }
  .shuffling { animation: shuffleShake 0.6s ease-in-out infinite; }

  .draw-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
    justify-items: center;
    gap: 22px 10px;
    margin-bottom: 26px;
  }
  .draw-grid.single { grid-template-columns: 1fr; }
  .draw-slot { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .draw-slot .pos-label { font-size: 12px; letter-spacing: 0.02em; color: var(--lavender); text-align: center; }

  .hint-text { font-size: 13px; color: var(--lavender); margin-bottom: 20px; }

  .interpreting-row { display: flex; align-items: center; gap: 10px; color: var(--lavender); font-size: 14px; }
  .interpreting-row .spin { animation: twinkle 1.2s ease-in-out infinite; }

  .result-panel {
    margin-top: 24px;
    padding: 22px 22px;
    background: linear-gradient(150deg, var(--panel-light), var(--panel));
    border: 1px solid rgba(201, 162, 75, 0.27);
    border-radius: 10px;
    animation: flipIn 0.6s ease;
  }
  .result-panel .label { font-size: 12px; color: var(--gold); margin-bottom: 12px; letter-spacing: 0.05em; }
  .result-panel .body { font-size: 15px; line-height: 1.9; color: var(--ivory); white-space: pre-wrap; }
  .result-panel .note { font-size: 11px; color: var(--lavender); margin-top: 18px; }

  .history-item {
    border: 1px solid rgba(201, 162, 75, 0.2);
    border-radius: 10px;
    padding: 16px 18px;
    background: var(--panel);
    cursor: pointer;
    margin-bottom: 12px;
  }
  .history-item .row { display: flex; justify-content: space-between; align-items: center; }
  .history-item .meta { font-size: 14px; color: var(--ivory); margin-bottom: 4px; }
  .history-item .date { font-size: 12px; color: var(--lavender); }
  .history-item .toggle { color: var(--gold); }
  .history-detail { margin-top: 14px; border-top: 1px solid rgba(201, 162, 75, 0.13); padding-top: 14px; display: none; }
  .history-detail.open { display: block; }
  .history-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .history-tag {
    font-size: 12px;
    border: 1px solid rgba(201, 162, 75, 0.27);
    border-radius: 14px;
    padding: 4px 10px;
    color: var(--gold-soft);
  }
  .history-body { font-size: 14px; line-height: 1.8; color: var(--ivory); white-space: pre-wrap; }
  .empty-note { color: var(--lavender); font-size: 14px; }
  .credit-note {
    text-align: center;
    font-size: 11px;
    color: var(--lavender);
    opacity: 0.6;
    margin-top: 48px;
  }
</style>
</head>
<body>

<div id="stars"></div>

<div class="wrap">
  <header id="headerBar">
    <div class="logo">
      <span class="mark">✦</span>
      <span class="title">夜想タロット</span>
    </div>
    <button class="btn-ghost" id="historyBtn">記録を見る</button>
  </header>

  <!-- 選択画面 -->
  <div class="screen active" id="screen-select">
    <p class="lead">今日はどんな問いを、<br>カードに委ねますか。</p>
    <p class="sub">問いの深さに合わせてスプレッドを選んでください。</p>
    <div id="spreadList"></div>
  </div>

  <!-- 占い実行画面 -->
  <div class="screen" id="screen-reading">
    <button class="back-link" id="backToSelect">← スプレッドを選び直す</button>
    <div class="reading-title" id="readingTitle"></div>
    <div class="reading-desc" id="readingDesc"></div>

    <div id="stepCategory">
      <span class="cat-label">何について占いますか</span>
      <div class="cat-list" id="catList"></div>
      <button class="primary-btn" id="drawBtn" disabled>カードを引く</button>
    </div>

    <div id="stepShuffle" style="display:none">
      <div class="shuffle-zone">
        <div class="card-back shuffling pulsing"><span class="sym">✦</span></div>
        <p class="shuffle-hint">カードを混ぜています…</p>
      </div>
    </div>

    <div id="stepDraws" style="display:none">
      <p class="hint-text" id="drawHint">カードをタップして開いてください。</p>
      <div class="draw-grid" id="drawGrid"></div>
      <button class="btn-ghost" id="revealAllBtn" style="margin-bottom:20px;">すべて開く</button>
      <button class="primary-btn" id="interpretBtn" style="display:none;">解釈を読む</button>
      <div class="interpreting-row" id="interpretingRow" style="display:none;">
        <span class="spin">✦</span>カードの声を読み解いています…
      </div>
      <div class="result-panel" id="resultPanel" style="display:none;">
        <div class="label">読み解き</div>
        <div class="body" id="resultBody"></div>
        <div class="note">占いは気づきのきっかけとして、心穏やかにお楽しみください。</div>
      </div>
    </div>
  </div>

  <!-- 履歴画面 -->
  <div class="screen" id="screen-history">
    <button class="back-link" id="backFromHistory">← 戻る</button>
    <div class="reading-title" style="margin-bottom:24px;">これまでの記録</div>
    <div id="historyList"></div>
  </div>

  <p class="credit-note">カード画像:Pamela Colman Smith画、ライダー・ウェイト版タロット(1909年、パブリックドメイン)</p>
</div>

<script>
/* ============ カードデータ ============ */
const MAJOR_ARCANA = [
  { id: 'm0', name: '愚者', symbol: '☉', upright: ['始まり', '自由', '無邪気な一歩'], reversed: ['向こう見ず', '準備不足', '迷走'] },
  { id: 'm1', name: '魔術師', symbol: '∞', upright: ['創造力', '意志の実現', '手持ちの力を使う'], reversed: ['空回り', '力の誤用', '自信喪失'] },
  { id: 'm2', name: '女教皇', symbol: '☽', upright: ['直感', '静かな知', '内なる声'], reversed: ['閉ざした心', '思い込み', '沈黙のしすぎ'] },
  { id: 'm3', name: '女帝', symbol: '♀', upright: ['豊かさ', '育む力', '実り'], reversed: ['過保護', '停滞', '浪費'] },
  { id: 'm4', name: '皇帝', symbol: '♂', upright: ['秩序', '統率', '揺るがぬ基盤'], reversed: ['頑固', '支配欲', '柔軟性の欠如'] },
  { id: 'm5', name: '法王', symbol: '☧', upright: ['伝統', '導き', '学びと信頼'], reversed: ['形式主義', '教条', '規範からの逸脱'] },
  { id: 'm6', name: '恋人', symbol: '♊', upright: ['結びつき', '選択', '価値観の一致'], reversed: ['すれ違い', '迷い', '不釣り合い'] },
  { id: 'm7', name: '戦車', symbol: '⚔', upright: ['前進する意志', '勝利', '自己コントロール'], reversed: ['暴走', '方向喪失', '力任せ'] },
  { id: 'm8', name: '力', symbol: '∞', upright: ['内なる強さ', '忍耐', '優しさによる制御'], reversed: ['自信喪失', '衝動', '力の乱用'] },
  { id: 'm9', name: '隠者', symbol: '☆', upright: ['内省', '探求', '静かな叡智'], reversed: ['孤立', '頑なさ', '答えの先延ばし'] },
  { id: 'm10', name: '運命の輪', symbol: '☸', upright: ['転機', '巡り合わせ', '流れに乗る'], reversed: ['停滞', '悪循環', '抗えない変化'] },
  { id: 'm11', name: '正義', symbol: '⚖', upright: ['均衡', '公正な判断', '因果'], reversed: ['偏り', '不誠実', '判断の誤り'] },
  { id: 'm12', name: '吊るされた男', symbol: '☾', upright: ['視点の転換', '待つ勇気', '手放し'], reversed: ['無駄な我慢', '停滞', '犠牲の誤用'] },
  { id: 'm13', name: '死神', symbol: '☠', upright: ['終わりと再生', '手放し', '次の段階へ'], reversed: ['執着', '変化への抵抗', '中途半端'] },
  { id: 'm14', name: '節制', symbol: '♒', upright: ['調和', 'バランス', '穏やかな統合'], reversed: ['不摂生', '過不足', '調整の失敗'] },
  { id: 'm15', name: '悪魔', symbol: '♄', upright: ['執着', '誘惑', '縛られた状態'], reversed: ['解放', '依存からの脱却', '気づき'] },
  { id: 'm16', name: '塔', symbol: '⚡', upright: ['突発的な崩壊', '価値観の崩壊', '真実の露呈'], reversed: ['危機の回避', '崩壊の予兆', '変化への抵抗'] },
  { id: 'm17', name: '星', symbol: '✦', upright: ['希望', '癒し', '静かな確信'], reversed: ['自信喪失', '理想と現実の乖離', '疲弊'] },
  { id: 'm18', name: '月', symbol: '☾', upright: ['不安', '曖昧さ', '無意識の声'], reversed: ['誤解の解消', '不安の軽減', '真実の輪郭'] },
  { id: 'm19', name: '太陽', symbol: '☀', upright: ['成功', '喜び', '素直さ'], reversed: ['一時的な曇り', '過信', '喜びの先延ばし'] },
  { id: 'm20', name: '審判', symbol: '🜂', upright: ['再生', '目覚め', '過去の統合'], reversed: ['迷い', '過去への未練', '決断の先延ばし'] },
  { id: 'm21', name: '世界', symbol: '◯', upright: ['完成', '達成', '一区切り'], reversed: ['未完了', 'あと一歩', '停滞'] },
];

const SUITS = [
  { key: 'wands', name: 'ワンド', element: '🜂', theme: '情熱・行動・意志' },
  { key: 'cups', name: 'カップ', element: '🜄', theme: '感情・関係・直感' },
  { key: 'swords', name: 'ソード', element: '🜁', theme: '思考・葛藤・言葉' },
  { key: 'pentacles', name: 'ペンタクル', element: '🜃', theme: '現実・資源・仕事' },
];

const NUMBER_MEANINGS = {
  1: { up: ['新しい芽生え', '純粋な始まり'], rev: ['出だしのつまずき', 'きっかけ不足'] },
  2: { up: ['選択', 'バランスの模索'], rev: ['決めきれなさ', '停滞した均衡'] },
  3: { up: ['広がり', '協力'], rev: ['計画の遅れ', '足並みの乱れ'] },
  4: { up: ['安定', '一区切りの休息'], rev: ['慣れによる停滞', '守りすぎ'] },
  5: { up: ['摩擦', '試練'], rev: ['対立の収束', '緊張の緩和'] },
  6: { up: ['調和', '分かち合い'], rev: ['一方的な関係', '過去への逃避'] },
  7: { up: ['試行錯誤', '踏ん張り'], rev: ['迷走', '見通しの甘さ'] },
  8: { up: ['集中', '着実な前進'], rev: ['行き詰まり', '力の分散'] },
  9: { up: ['成熟', 'あと一歩の到達'], rev: ['孤独感', '疲労の蓄積'] },
  10: { up: ['完了', '一つのサイクルの終わり'], rev: ['重荷', '過剰な負担'] },
};

const COURT = [
  { key: 'page', name: 'ペイジ', up: ['学びの姿勢', '好奇心'], rev: ['未熟さ', '空回りする興味'] },
  { key: 'knight', name: 'ナイト', up: ['行動力', 'まっすぐな追求'], rev: ['性急さ', '独りよがりな突進'] },
  { key: 'queen', name: 'クイーン', up: ['成熟した受容', '内面の充実'], rev: ['感情の揺らぎ', '内向きすぎる態度'] },
  { key: 'king', name: 'キング', up: ['熟達', '責任ある采配'], rev: ['支配的な態度', '力の押しつけ'] },
];

function buildMinorArcana() {
  const cards = [];
  for (const suit of SUITS) {
    for (let n = 1; n <= 10; n++) {
      const meaning = NUMBER_MEANINGS[n];
      cards.push({
        id: suit.key + n,
        name: suit.name + 'の' + n,
        symbol: suit.element,
        upright: [...meaning.up, suit.theme],
        reversed: [...meaning.rev, suit.theme + 'の乱れ'],
      });
    }
    for (const court of COURT) {
      cards.push({
        id: suit.key + '_' + court.key,
        name: suit.name + 'の' + court.name,
        symbol: suit.element,
        upright: [...court.up, suit.theme],
        reversed: [...court.rev, suit.theme + 'の乱れ'],
      });
    }
  }
  return cards;
}

const FULL_DECK = [...MAJOR_ARCANA, ...buildMinorArcana()];

const SPREADS = {
  one: { id: 'one', name: 'ワンオラクル', description: '今日の一枚。シンプルな問いに向き合う', positions: ['今日のカード'] },
  three: { id: 'three', name: 'スリーカード', description: '過去・現在・未来の流れを読む', positions: ['過去', '現在', '未来'] },
  celtic: {
    id: 'celtic',
    name: 'ケルト十字',
    description: '10枚で多角的に深堀りする本格スプレッド',
    positions: ['現在の状況', '課題・障害', '顕在意識・目標', '潜在意識・土台', '過去', '近い未来', '自分自身の立場', '周囲の影響', '望みや恐れ', '最終結果'],
  },
};

const CATEGORIES = [
  { key: 'school', label: '学校' },
  { key: 'work', label: '仕事' },
  { key: 'life', label: '生活' },
  { key: 'love', label: '恋愛' },
  { key: 'study', label: '勉強' },
  { key: 'challenge', label: '新しいことへのチャレンジ' },
];

/* ============ ユーティリティ ============ */
function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function drawCards(spreadId) {
  const spread = SPREADS[spreadId];
  const deck = shuffleArray(FULL_DECK);
  return spread.positions.map((label, i) => ({
    label,
    card: deck[i],
    reversed: Math.random() < 0.5,
    revealed: false,
  }));
}

function makeCycler(pool) {
  const shuffled = shuffleArray(pool);
  let i = 0;
  return () => {
    const item = shuffled[i % shuffled.length];
    i++;
    return item;
  };
}

function buildInterpretation(categoryKey, draws) {
  const content = CATEGORY_CONTENT[categoryKey];
  const nextPositive = makeCycler(content.positive);
  const nextCaution = makeCycler(content.caution);
  const nextSummary = makeCycler(content.summary);

  const lines = draws.map((d) => {
    const phrase = d.reversed ? nextCaution() : nextPositive();
    const kws = d.reversed ? d.card.reversed : d.card.upright;
    const orientation = d.reversed ? '逆位置' : '正位置';
    return d.label + 'に現れた「' + d.card.name + '」(' + orientation + ')は、' + kws[0] + 'や' + kws[1] + 'を意味します。' + phrase;
  });

  return [content.intro, ...lines, nextSummary()].join('\n\n');
}

/* ============ localStorage ============ */
const STORAGE_KEY = 'yasou_tarot_readings';

function loadReadings() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    console.error('load failed', e);
    return [];
  }
}

function saveReading(reading) {
  try {
    const list = loadReadings();
    list.unshift(reading);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
    return true;
  } catch (e) {
    console.error('save failed', e);
    return false;
  }
}

/* ============ 画面制御 ============ */
const screens = {
  select: document.getElementById('screen-select'),
  reading: document.getElementById('screen-reading'),
  history: document.getElementById('screen-history'),
};

function showScreen(name) {
  Object.values(screens).forEach((s) => s.classList.remove('active'));
  screens[name].classList.add('active');
}

/* ============ 状態 ============ */
let state = {
  spreadId: null,
  category: null,
  draws: [],
};

/* ============ 選択画面の描画 ============ */
function renderSpreadList() {
  const list = document.getElementById('spreadList');
  list.innerHTML = '';
  const items = [
    { id: 'one', title: 'ワンオラクル', sub: '1枚 · 今日の指針' },
    { id: 'three', title: 'スリーカード', sub: '3枚 · 過去 / 現在 / 未来' },
    { id: 'celtic', title: 'ケルト十字', sub: '10枚 · 本格的な深堀り' },
  ];
  items.forEach((it) => {
    const div = document.createElement('div');
    div.className = 'spread-card';
    div.innerHTML =
      '<div><div class="title">' + it.title + '</div><div class="desc">' + it.sub + '</div></div>' +
      '<span class="arrow">›</span>';
    div.addEventListener('click', () => startSpread(it.id));
    list.appendChild(div);
  });
}

function startSpread(id) {
  state.spreadId = id;
  state.category = null;
  state.draws = [];

  const spread = SPREADS[id];
  document.getElementById('readingTitle').textContent = spread.name;
  document.getElementById('readingDesc').textContent = spread.description;

  document.getElementById('stepCategory').style.display = 'block';
  document.getElementById('stepShuffle').style.display = 'none';
  document.getElementById('stepDraws').style.display = 'none';
  document.getElementById('resultPanel').style.display = 'none';
  document.getElementById('interpretingRow').style.display = 'none';
  document.getElementById('interpretBtn').style.display = 'none';

  renderCategoryList();
  document.getElementById('drawBtn').disabled = true;

  showScreen('reading');
}

function renderCategoryList() {
  const list = document.getElementById('catList');
  list.innerHTML = '';
  CATEGORIES.forEach((c) => {
    const btn = document.createElement('button');
    btn.className = 'cat-btn';
    btn.textContent = c.label;
    btn.addEventListener('click', () => {
      state.category = c.key;
      Array.from(list.children).forEach((el) => el.classList.remove('selected'));
      btn.classList.add('selected');
      document.getElementById('drawBtn').disabled = false;
    });
    list.appendChild(btn);
  });
}

document.getElementById('drawBtn').addEventListener('click', beginShuffle);

function beginShuffle() {
  document.getElementById('stepCategory').style.display = 'none';
  document.getElementById('stepShuffle').style.display = 'block';
  setTimeout(() => {
    state.draws = drawCards(state.spreadId);
    document.getElementById('stepShuffle').style.display = 'none';
    document.getElementById('stepDraws').style.display = 'block';
    renderDrawGrid();
  }, 1300);
}

function renderDrawGrid() {
  const grid = document.getElementById('drawGrid');
  grid.innerHTML = '';
  grid.classList.toggle('single', state.draws.length === 1);

  state.draws.forEach((d, i) => {
    const slot = document.createElement('div');
    slot.className = 'draw-slot';
    const label = document.createElement('div');
    label.className = 'pos-label';
    label.textContent = d.label;
    slot.appendChild(label);

    const cardEl = document.createElement('div');
    slot.appendChild(cardEl);
    grid.appendChild(slot);
    renderCardSlot(cardEl, i);
  });

  document.getElementById('revealAllBtn').style.display = 'inline-block';
  document.getElementById('interpretBtn').style.display = 'none';
  updateHintText();
}

function renderCardSlot(el, index) {
  const d = state.draws[index];
  if (!d.revealed) {
    el.className = 'card-back';
    el.innerHTML = '<span class="sym">✦</span>';
    el.onclick = () => {
      d.revealed = true;
      renderCardSlot(el, index);
      updateHintText();
      checkAllRevealed();
    };
  } else {
    el.onclick = null;
    el.className = 'card-face' + (d.reversed ? ' reversed' : '');
    const kws = d.reversed ? d.card.reversed : d.card.upright;
    el.innerHTML =
      '<img src="images/cards/' + d.card.id + '.jpg" alt="' + d.card.name + '" onerror="this.style.display=\'none\'">' +
      '<span class="caption">' +
      '<span class="name">' + d.card.name + '</span><br>' +
      '<span class="kw">' + kws[0] + '</span>' +
      '</span>';
  }
}

function updateHintText() {
  const allRevealed = state.draws.every((d) => d.revealed);
  document.getElementById('drawHint').textContent = allRevealed
    ? 'すべてのカードが開かれました。'
    : 'カードをタップして開いてください。';
}

function checkAllRevealed() {
  const allRevealed = state.draws.every((d) => d.revealed);
  if (allRevealed) {
    document.getElementById('revealAllBtn').style.display = 'none';
    document.getElementById('interpretBtn').style.display = 'inline-block';
  }
}

document.getElementById('revealAllBtn').addEventListener('click', () => {
  state.draws.forEach((d) => (d.revealed = true));
  renderDrawGrid();
  checkAllRevealed();
});

document.getElementById('interpretBtn').addEventListener('click', () => {
  document.getElementById('interpretBtn').style.display = 'none';
  document.getElementById('interpretingRow').style.display = 'flex';
  setTimeout(() => {
    const text = buildInterpretation(state.category, state.draws);
    document.getElementById('interpretingRow').style.display = 'none';
    const panel = document.getElementById('resultPanel');
    panel.style.display = 'block';
    document.getElementById('resultBody').textContent = text;

    const spread = SPREADS[state.spreadId];
    const categoryLabel = CATEGORIES.find((c) => c.key === state.category).label;
    saveReading({
      timestamp: Date.now(),
      spreadName: spread.name,
      categoryLabel,
      draws: state.draws.map((d) => ({ label: d.label, cardName: d.card.name, reversed: d.reversed })),
      interpretation: text,
    });
  }, 600);
});

document.getElementById('backToSelect').addEventListener('click', () => showScreen('select'));
document.getElementById('headerBar').addEventListener('click', () => showScreen('select'));
document.getElementById('backFromHistory').addEventListener('click', () => showScreen('select'));

/* ============ 履歴画面 ============ */
document.getElementById('historyBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  renderHistory();
  showScreen('history');
});

function renderHistory() {
  const list = document.getElementById('historyList');
  const items = loadReadings();
  list.innerHTML = '';

  if (items.length === 0) {
    const p = document.createElement('p');
    p.className = 'empty-note';
    p.textContent = 'まだ記録がありません。占いをすると、ここに残ります。';
    list.appendChild(p);
    return;
  }

  items.forEach((item) => {
    const date = new Date(item.timestamp);
    const dateStr = date.getFullYear() + '/' + (date.getMonth() + 1) + '/' + date.getDate() + ' ' +
      String(date.getHours()).padStart(2, '0') + ':' + String(date.getMinutes()).padStart(2, '0');

    const div = document.createElement('div');
    div.className = 'history-item';

    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML =
      '<div><div class="meta">' + item.spreadName + (item.categoryLabel ? ' — ' + item.categoryLabel : '') + '</div>' +
      '<div class="date">' + dateStr + '</div></div>' +
      '<span class="toggle">+</span>';
    div.appendChild(row);

    const detail = document.createElement('div');
    detail.className = 'history-detail';

    const tags = document.createElement('div');
    tags.className = 'history-tags';
    item.draws.forEach((d) => {
      const tag = document.createElement('span');
      tag.className = 'history-tag';
      tag.textContent = d.label + ': ' + d.cardName + '(' + (d.reversed ? '逆' : '正') + ')';
      tags.appendChild(tag);
    });
    detail.appendChild(tags);

    const body = document.createElement('p');
    body.className = 'history-body';
    body.textContent = item.interpretation;
    detail.appendChild(body);

    div.appendChild(detail);

    div.addEventListener('click', () => {
      const isOpen = detail.classList.toggle('open');
      row.querySelector('.toggle').textContent = isOpen ? '−' : '+';
    });

    list.appendChild(div);
  });
}
